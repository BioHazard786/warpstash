name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: vars
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Compute image name
        id: imagename
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner_lc}/warpstash" >> "$GITHUB_OUTPUT"

      - name: Build and push Warpstash image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            WARPSTASH_VERSION=${{ steps.vars.outputs.VERSION }}
          tags: |
            ${{ steps.imagename.outputs.name }}:${{ steps.vars.outputs.VERSION }}
            ${{ steps.imagename.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=Warpstash
            org.opencontainers.image.description=Ephemeral file storage service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.vars.outputs.VERSION }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          echo "Published: ${{ steps.imagename.outputs.name }}:${{ steps.vars.outputs.VERSION }}"
          echo "Also tagged: ${{ steps.imagename.outputs.name }}:latest"
          echo "Pull with: docker pull ${{ steps.imagename.outputs.name }}:${{ steps.vars.outputs.VERSION }}"

  release-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build frontend static bundle
        run: |
          cd web
          npm install
          npm run build
          cd ..

      - name: Build and package release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          targets=(
            "linux/amd64/warpstash"
            "linux/arm64/warpstash"
            "darwin/amd64/warpstash"
            "darwin/arm64/warpstash"
            "windows/amd64/warpstash.exe"
          )
          for target in "${targets[@]}"; do
            IFS="/" read -r target_os target_arch target_bin <<< "$target"
            output_dir="dist/${target_os}_${target_arch}"
            mkdir -p "$output_dir"
            echo "Building for ${target_os}/${target_arch}..."
            CGO_ENABLED=0 GOOS=$target_os GOARCH=$target_arch go build \
              -ldflags="-s -w -X warpstash/internal/config.Version=${VERSION}" \
              -o "${output_dir}/${target_bin}" \
              ./cmd/warpstash

            archive_name="warpstash_${VERSION}_${target_os}_${target_arch}"
            if [ "$target_os" = "windows" ]; then
              (cd "$output_dir" && zip "../../dist/${archive_name}.zip" "$target_bin")
            else
              (cd "$output_dir" && tar -czvf "../../dist/${archive_name}.tar.gz" "$target_bin")
            fi
          done

          cd dist
          sha256sum warpstash_*.tar.gz warpstash_*.zip > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            dist/warpstash_*.tar.gz \
            dist/warpstash_*.zip \
            dist/checksums.txt \
            --title "Warpstash $VERSION" \
            --generate-notes

