name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: imagename
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner_lc}/warpstash" >> "$GITHUB_OUTPUT"

      # `latest` only moves for stable tags: not for pre-releases (v1.2.0-rc1) or manual branch runs.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imagename.outputs.name }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Warpstash
            org.opencontainers.image.description=Ephemeral file storage service

      - name: Build and push Warpstash image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            WARPSTASH_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          echo "Published tags:"
          echo "${{ steps.meta.outputs.tags }}"

  release-binaries:
    needs: ci
    # a manual run from a branch must not create a GitHub release named after the branch
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'backend/go.mod'

      - name: Build frontend static bundle
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Build and package release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          targets=(
            "linux/amd64/warpstash"
            "linux/arm64/warpstash"
            "darwin/amd64/warpstash"
            "darwin/arm64/warpstash"
            "windows/amd64/warpstash.exe"
          )
          for target in "${targets[@]}"; do
            IFS="/" read -r target_os target_arch target_bin <<< "$target"
            output_dir="dist/${target_os}_${target_arch}"
            mkdir -p "$output_dir"
            echo "Building for ${target_os}/${target_arch}..."
            (cd backend && CGO_ENABLED=0 GOOS=$target_os GOARCH=$target_arch go build -trimpath \
              -ldflags="-s -w -X warpstash/internal/config.Version=${VERSION}" \
              -o "../${output_dir}/${target_bin}" \
              ./cmd/warpstash)

            archive_name="warpstash_${VERSION}_${target_os}_${target_arch}"
            if [ "$target_os" = "windows" ]; then
              (cd "$output_dir" && zip "../../dist/${archive_name}.zip" "$target_bin")
            else
              (cd "$output_dir" && tar -czvf "../../dist/${archive_name}.tar.gz" "$target_bin")
            fi
          done

          cd dist
          sha256sum warpstash_*.tar.gz warpstash_*.zip > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            dist/warpstash_*.tar.gz \
            dist/warpstash_*.zip \
            dist/checksums.txt \
            --title "Warpstash $VERSION" \
            --generate-notes

