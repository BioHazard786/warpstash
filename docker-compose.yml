services:
  warpstash:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WARPSTASH_MAX_FILE_SIZE_MB: ${WARPSTASH_MAX_FILE_SIZE_MB:-1024}
        WARPSTASH_MAX_FILES: ${WARPSTASH_MAX_FILES:-10}
        WARPSTASH_VERSION: ${WARPSTASH_VERSION:-v1.0.0}
    container_name: warpstash
    restart: unless-stopped
    ports:
      - "${WARPSTASH_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # In-container path overrides (guaranteed to match the container VOLUME)
      - WARPSTASH_PORT=8080
      - WARPSTASH_STORAGE_PATH=/data/storage
      - WARPSTASH_DB_PATH=/data/warpstash.db
    volumes:
      - warpstash_data:/data

volumes:
  warpstash_data:
